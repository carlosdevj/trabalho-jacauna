<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Ambiguidade em linguagem natural</title>
  <desc id="desc">Representacao de uma conversa em que a pergunta humana pode ter mais de uma interpretacao.</desc>
  <rect width="800" height="520" fill="#f8fafc"/>
  <rect x="80" y="90" width="300" height="95" rx="22" fill="#d1fae5" stroke="#047857" stroke-width="5"/>
  <text x="115" y="145" font-family="Arial, sans-serif" font-size="28" fill="#064e3b">Reserve para sexta</text>
  <rect x="420" y="230" width="300" height="150" rx="22" fill="#fee2e2" stroke="#b91c1c" stroke-width="5"/>
  <text x="455" y="285" font-family="Arial, sans-serif" font-size="25" fill="#991b1b">Sexta-feira?</text>
  <text x="455" y="325" font-family="Arial, sans-serif" font-size="25" fill="#991b1b">Dia 6?</text>
  <text x="455" y="365" font-family="Arial, sans-serif" font-size="25" fill="#991b1b">As 18h?</text>
  <path d="M385 160c90 12 115 45 115 70" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <text x="115" y="455" font-family="Arial, sans-serif" font-size="28" fill="#991b1b">Linguagem natural exige confirmacao</text>
</svg>
