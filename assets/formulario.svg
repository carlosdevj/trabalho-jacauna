<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Interface baseada em formulário</title>
  <desc id="desc">Campos com rótulos, instrução e botão de envio.</desc>
  <rect width="800" height="600" rx="32" fill="#f8fafc"/>
  
  <rect x="130" y="55" width="540" height="490" rx="25" fill="#ffffff" stroke="#064e3b" stroke-width="9"/>
  <text x="180" y="115" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Formulário de inscrição</text>
  <text x="180" y="165" font-family="Arial" font-size="24" font-weight="700" fill="#111827">Nome completo *</text>
  <rect x="180" y="185" width="440" height="58" rx="10" fill="#ffffff" stroke="#4b5563" stroke-width="5"/>
  <text x="180" y="290" font-family="Arial" font-size="24" font-weight="700" fill="#111827">E-mail *</text>
  <rect x="180" y="310" width="440" height="58" rx="10" fill="#ffffff" stroke="#4b5563" stroke-width="5"/>
  <text x="180" y="405" font-family="Arial" font-size="20" fill="#7c2d12">Informe um endereço válido. Ex.: nome@email.com</text>
  <rect x="180" y="445" width="230" height="62" rx="12" fill="#064e3b"/>
  <text x="295" y="485" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#ffffff">ENVIAR</text>
  <circle cx="605" cy="475" r="28" fill="#facc15"/>
  <path d="M592 475l10 10 18-24" fill="none" stroke="#111827" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
