<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Interface de linha de comando</title>
  <desc id="desc">Terminal com comandos de instalação e controle de versão.</desc>
  <rect width="800" height="600" rx="32" fill="#f8fafc"/>
  
  <rect x="70" y="80" width="660" height="440" rx="24" fill="#111827"/>
  <rect x="70" y="80" width="660" height="65" rx="20" fill="#064e3b"/>
  <circle cx="115" cy="112" r="11" fill="#facc15"/>
  <circle cx="150" cy="112" r="11" fill="#ffffff"/>
  <circle cx="185" cy="112" r="11" fill="#86efac"/>
  <g font-family="monospace" font-size="29">
    <text x="105" y="205" fill="#86efac">$ pnpm install</text>
    <text x="105" y="255" fill="#ffffff">Packages: +128</text>
    <text x="105" y="305" fill="#ffffff">Progress: resolved 128</text>
    <text x="105" y="355" fill="#facc15">Done in 2.4s</text>
    <text x="105" y="425" fill="#86efac">$ git status</text>
    <rect x="285" y="402" width="20" height="30" fill="#ffffff"/>
  </g>

</svg>
